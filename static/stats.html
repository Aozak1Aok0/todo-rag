<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可观测面板 · todo-rag</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --line:#2a303a;
    --text:#e6e9ef; --muted:#9aa4b2; --accent:#339cff; --ok:#7bd88f; --warn:#ffb454; --err:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:36px 20px 64px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px}
  .controls{display:flex;gap:8px;align-items:center}
  select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
                border-radius:8px;padding:8px 12px;font:13px var(--mono);cursor:pointer}
  button:hover{border-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .k{color:var(--muted);font-size:12px}
  .v{font:600 22px/1.3 var(--mono);margin-top:4px}
  .v.small{font-size:16px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.num{font-family:var(--mono)}
  .kind{color:var(--accent)}
  .err{color:var(--err)}
  .warn{color:var(--warn)}
  .empty{color:var(--muted);padding:20px 0}
  .proposal-section{margin-top:24px}
  .section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .proposal-cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:10px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px}
  .pill .n{font:12px var(--mono);color:var(--text);margin-left:6px}
  .pill.pending,.pill.executing{color:var(--warn);border-color:rgba(255,180,84,.4)}
  .pill.executed{color:var(--ok);border-color:rgba(123,216,143,.4)}
  .pill.failed,.pill.expired{color:var(--err);border-color:rgba(255,107,107,.4)}
  .proposal-empty{color:var(--muted);padding:14px 0}
  footer{margin-top:28px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>可观测面板</h1>
      <div class="sub">接口与 MCP 工具的事件汇总 + proposal 审计 · 数据来自 <code>/stats</code></div>
    </div>
    <div class="controls">
      <select id="days">
        <option value="1">最近 1 天</option>
        <option value="7" selected>最近 7 天</option>
        <option value="30">最近 30 天</option>
      </select>
      <button id="refresh">刷新</button>
    </div>
  </header>

  <div class="cards" id="cards"></div>

  <section class="proposal-section">
    <div class="section-head">
      <div>
        <div class="sub">Proposal 审计 · 按创建时间落入当前窗口</div>
        <div class="pills" id="status-pills"></div>
      </div>
    </div>
    <div class="cards proposal-cards" id="proposal-cards"></div>
    <div class="proposal-empty" id="proposal-empty" style="display:none">这个窗口内还没有写操作 proposal。</div>
    <table>
      <thead>
        <tr>
          <th>action</th><th>总数</th><th>已执行</th><th>已取消</th>
          <th>失败</th><th>过期</th><th>待确认</th>
        </tr>
      </thead>
      <tbody id="action-rows"></tbody>
    </table>
  </section>

  <section style="margin-top:22px">
    <div class="sub">按类型 / 名称</div>
    <table>
      <thead>
        <tr>
          <th>kind</th><th>name</th><th>次数</th><th>错误</th>
          <th>平均</th><th>p95</th><th>输入</th><th>输出</th><th>成本</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">这个时间窗口还没有事件。去问一次 `/rag` 或调一下 MCP 工具。</div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);

function card(label, value, cls) {
  const c = document.createElement('div');
  c.className = 'card';
  const k = document.createElement('div'); k.className = 'k'; k.textContent = label;
  const v = document.createElement('div'); v.className = 'v' + (cls ? ' ' + cls : '');
  v.textContent = value;
  c.append(k, v);
  return c;
}

function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : ms + ' ms'; }
function fmtCost(c) { return '$' + (c < 0.01 ? c.toFixed(5) : c.toFixed(4)); }
function pct(x) { return ((x || 0) * 100).toFixed(1) + '%'; }
function fmtAge(sec) {
  if (!sec) return '0 s';
  if (sec < 60) return Math.round(sec) + ' s';
  if (sec < 3600) return Math.round(sec / 60) + ' min';
  return (sec / 3600).toFixed(1) + ' h';
}

const STATUS_LABEL = {
  pending: '待确认',
  executing: '执行中',
  executed: '已执行',
  cancelled: '已取消',
  failed: '失败',
  expired: '已过期',
};

async function load() {
  const days = $('#days').value;
  const resp = await fetch('/stats?days=' + days);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const d = await resp.json();
  const t = d.totals;

  const cards = $('#cards');
  cards.replaceChildren(
    card('调用次数', String(t.count)),
    card('错误率', (t.error_rate * 100).toFixed(1) + '%', t.errors ? 'err' : ''),
    card('平均延迟', fmtMs(t.avg_latency_ms)),
    card('p95 延迟', fmtMs(t.p95_latency_ms)),
    card('输入 tokens', t.tokens_in.toLocaleString()),
    card('输出 tokens', t.tokens_out.toLocaleString()),
    card('成本', fmtCost(t.cost_usd))
  );

  const p = d.proposals || {};
  const proposalCards = $('#proposal-cards');
  const statusPills = $('#status-pills');
  const actionRows = $('#action-rows');
  statusPills.replaceChildren();
  actionRows.replaceChildren();

  if (p.error) {
    proposalCards.replaceChildren(card('Proposal 审计', p.error, 'err'));
    $('#proposal-empty').style.display = 'none';
  } else {
    const statuses = p.by_status || {};
    proposalCards.replaceChildren(
      card('proposal 总数', String(p.total || 0)),
      card('确认率', pct(p.approval_rate)),
      card('失败率', pct(p.failure_rate), p.failure_rate ? 'err' : ''),
      card('stale 回收', String(p.stale_recovered || 0), p.stale_recovered ? 'warn' : ''),
      card('平均决策', fmtMs(p.avg_decision_ms || 0)),
      card('p95 决策', fmtMs(p.p95_decision_ms || 0)),
      card('待确认', String(statuses.pending || 0)),
      card('最老待确认', fmtAge(p.oldest_pending_seconds || 0))
    );

    for (const [status, label] of Object.entries(STATUS_LABEL)) {
      const el = document.createElement('span');
      el.className = 'pill ' + status;
      el.textContent = label;
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(statuses[status] || 0);
      el.append(n);
      statusPills.append(el);
    }

    for (const a of p.by_action || []) {
      const tr = document.createElement('tr');
      const vals = [
        [a.action, 'kind'], [String(a.total || 0), 'num'],
        [String(a.executed || 0), 'num'], [String(a.cancelled || 0), 'num'],
        [String(a.failed || 0), 'num'], [String(a.expired || 0), 'num'],
        [String(a.pending || 0), 'num'],
      ];
      for (const [val, cls] of vals) {
        const td = document.createElement('td');
        if (cls) td.className = cls;
        td.textContent = val;
        tr.append(td);
      }
      actionRows.append(tr);
    }
    $('#proposal-empty').style.display = p.total ? 'none' : 'block';
  }

  const rows = $('#rows');
  rows.replaceChildren();
  for (const g of d.groups) {
    const tr = document.createElement('tr');
    const cells = [
      [g.kind, 'kind'], [g.name, ''], [String(g.count), 'num'],
      [String(g.errors), 'num' + (g.errors ? ' err' : '')],
      [fmtMs(g.avg_latency_ms), 'num'], [fmtMs(g.p95_latency_ms), 'num'],
      [g.tokens_in.toLocaleString(), 'num'], [g.tokens_out.toLocaleString(), 'num'],
      [fmtCost(g.cost_usd), 'num'],
    ];
    for (const [val, cls] of cells) {
      const td = document.createElement('td');
      if (cls) td.className = cls;
      td.textContent = val;
      tr.append(td);
    }
    rows.append(tr);
  }
  $('#empty').style.display = d.groups.length ? 'none' : 'block';

  const rates = d.rates_usd_per_m;
  $('#foot').textContent = `窗口 ${d.window_days} 天 · 单价 $${rates.in}/M 输入、$${rates.out}/M 输出 · 更新于 ${new Date().toLocaleTimeString()}`;
}

$('#refresh').addEventListener('click', () => load().catch((e) => {
  $('#foot').textContent = '加载失败：' + e.message;
}));
$('#days').addEventListener('change', () => load().catch(() => {}));
load().catch((e) => { $('#foot').textContent = '加载失败：' + e.message; });
</script>
</body>
</html>
